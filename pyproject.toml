[project]
name = "live-audio-translation"
version = "0.1.0"
description = "Local prototype for English-to-Spanish speech translation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6",
    "piper-tts>=1.6.0",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "webrtcvad-wheels>=2.0.14",
]

[project.scripts]
transcribe-whisper = "live_audio_translation.transcribe_whisper:main"
transcribe-microphone = "live_audio_translation.transcribe_microphone:main"
translate-stream = "live_audio_translation.translate_stream:main"
buffer-phrases = "live_audio_translation.buffer_phrases:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
